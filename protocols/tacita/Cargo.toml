[package]
name = "tacita-ste-comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"

[dependencies]
silent-batched-threshold-encryption = { path = "upstream/batched-silent-threshold-encryption" }
ark-bls12-381 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-poly = "=0.5.0"
ark-serialize = "=0.5.0"
ark-std = "=0.5.0"
rand = "=0.8.5"
rayon = "=1.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
clap = { version = "=4.5.40", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

